version: 2
updates:
  # pnpm workspace root: covers apps/web and packages/sdk, which share the
  # single pnpm-lock.yaml at the repository root.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Held back on purpose, re-check when the plugins catch up:
    # - eslint 10: the latest eslint-plugin-react (7.37.5, peer range up to
    #   ESLint ^9.7, pulled in by eslint-config-next) throws "contextOrFilename
    #   .getFilename is not a function" under ESLint 10.
    # - typescript 7: typescript-eslint does not support it and the SDK build
    #   fails with TS5011.
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # The indexer is a separate npm project with its own package-lock.json,
  # not part of the pnpm workspace above.
  - package-ecosystem: "npm"
    directory: "/indexer"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "gomod"
    directory: "/watcher"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
